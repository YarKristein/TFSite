<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed — TrailFreaks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .wordmark {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.6px;
      color: #3A5A40;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; }
    p { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 32px; }
    .btn-open {
      display: block; width: 100%;
      background: #3A5A40; color: #fff;
      border: none; border-radius: 12px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
      padding: 14px 24px; margin-bottom: 12px;
      cursor: pointer;
    }
    .btn-store {
      display: block;
      background: #FF6B2B; color: #fff; text-decoration: none;
      border-radius: 12px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
      padding: 14px 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">TRAILFREAKS</div>
    <div class="icon">✅</div>
    <h1>Email confirmed!</h1>
    <p>Your account is ready. Open the TrailFreaks app to start exploring trails.</p>
    <button class="btn-open" onclick="openApp()">Open TrailFreaks</button>
    <a class="btn-store" href="https://apps.apple.com/app/id6762764040">Download on the App Store</a>
  </div>
  <script>
    function openApp() {
      window.location = 'trailfreaks://auth-callback' + window.location.hash;
    }
    // Auto-attempt on load so tapping the email link opens the app directly
    setTimeout(openApp, 400);
  </script>
</body>
</html>
