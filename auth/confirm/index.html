<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed — TrailFreaks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,700&family=Barlow:wght@300;400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #F1F4EE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow', -apple-system, 'Segoe UI', sans-serif;
      font-weight: 300;
      padding: 24px;
      color: #181E14;
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.028;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .card {
      background: #FAFBF8;
      border: 1px solid #CAD4C4;
      border-radius: 20px;
      padding: 0 0 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 28px rgba(24,30,20,0.09);
      overflow: hidden;
    }
    .card-header {
      background: #2A6442;
      padding: 16px 40px;
      margin-bottom: 36px;
    }
    .wordmark {
      font-family: 'Barlow Condensed', 'Oswald', Impact, sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.3em;
      color: #FAFBF8;
      text-transform: uppercase;
    }
    .kicker {
      font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: #6C7868;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .kicker-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2A6442;
      box-shadow: 0 0 0 4px rgba(42,100,66,0.14);
      flex-shrink: 0;
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    h1 {
      font-family: 'Barlow Condensed', 'Oswald', Impact, sans-serif;
      font-weight: 800;
      font-size: 56px;
      line-height: 0.92;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: #181E14;
      margin-bottom: 20px;
      padding: 0 40px;
    }
    h1 em {
      font-style: italic;
      color: #2A6442;
      font-weight: 700;
    }
    p {
      font-size: 15px;
      font-weight: 300;
      color: #4C5A48;
      line-height: 1.7;
      margin-bottom: 32px;
      padding: 0 40px;
    }
    .btn-primary {
      display: block;
      margin: 0 40px 12px;
      background: #E85A2B;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 15px 24px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.22s, transform 0.22s;
    }
    .btn-primary:hover { background: #C94819; transform: translateY(-1px); }
    .btn-secondary {
      display: block;
      margin: 0 40px;
      color: #6C7868;
      text-decoration: none;
      font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 13px 24px;
      border: 1px solid #CAD4C4;
      border-radius: 999px;
      transition: border-color 0.22s, color 0.22s;
    }
    .btn-secondary:hover { border-color: #2A6442; color: #2A6442; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="wordmark">TrailFreaks</div>
    </div>
    <div class="kicker"><span class="kicker-dot"></span>Email confirmed</div>
    <h1>You're on<br>the <em>trail.</em></h1>
    <p>Your account is ready. Open the TrailFreaks app to start exploring.</p>
    <button class="btn-primary" onclick="openApp()">Open TrailFreaks →</button>
    <a class="btn-secondary" href="https://apps.apple.com/app/id6762764040">Download on the App Store</a>
  </div>
  <script>
    function openApp() {
      window.location = 'trailfreaks://auth-callback' + window.location.hash;
    }
    setTimeout(openApp, 400);
  </script>
</body>
</html>
